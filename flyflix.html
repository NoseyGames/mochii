<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Dynamic Ad & Iframe Blocker -->
    <script>
      (function() {
        const observer = new MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.tagName === 'IFRAME') {
                const src = node.src || '';
                const srcdoc = node.getAttribute('srcdoc') || '';
                if (
                  src.includes('subduepaler.cyou') || 
                  src.includes('fy.illamonvascons.com') || 
                  srcdoc.includes('TURN ON Ad Blocker')
                ) {
                  node.remove();
                  console.warn('Blocked unwanted iframe ad injection.');
                }
              }
            });
          });
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      })();
    </script>

    <!-- CSS Fallback Hiding Rules -->
    <style>
      iframe[src*="subduepaler.cyou"],
      iframe[src*="fy.illamonvascons.com"],
      iframe[srcdoc*="TURN ON Ad Blocker"] {
        display: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
    </style>
