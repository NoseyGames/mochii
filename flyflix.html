<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Flyflix · Monkeh</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#eee;background:#111}
    *{box-sizing:border-box}html,body{margin:0;height:100%}body{display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:16px;padding:12px 18px;border-bottom:1px solid #333;background:#181818}
    strong{letter-spacing:-.03em;font-size:19px}p{margin:0;flex:1;color:#b4b4bf;font-size:13px;line-height:1.5}
    a,button{color:#eee;border:1px solid #454550;border-radius:8px;padding:8px 12px;background:#25252d;text-decoration:none;font:inherit;font-size:12px;cursor:pointer}
    iframe{width:100%;flex:1;min-height:0;border:0;background:#090909}button:hover,a:hover{background:#363641}
    @media(max-width:600px){header{flex-wrap:wrap}p{flex-basis:70%}}
  </style>
</head>
<body>
  <header>
    <strong>Flyflix</strong>
    <p id="status" role="status">Opening provider content in an isolated view…</p>
    <button id="retry" type="button">Reload</button>
    <a href="https://github.com/Consessions/flyflix" target="_blank" rel="noopener noreferrer">Provider source</a>
  </header>
  <iframe id="provider" title="Isolated Flyflix provider" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  <script>
    const frame = document.getElementById('provider');
    const status = document.getElementById('status');
    let timeout;
    let generation = 0;
    let providerOrigin = '';
    function validateProviderOrigin(value) {
      const origin = new URL(value);
      if (!['http:', 'https:'].includes(origin.protocol) || origin.username || origin.password || origin.origin !== value || origin.origin === location.origin) {
        throw new Error('Flyflix requires a separate configured proxy origin.');
      }
      return origin.origin;
    }
    async function loadProvider() {
      clearTimeout(timeout);
      const current = ++generation;
      status.textContent = 'Opening provider content in an isolated view…';
      try {
        const response = await fetch('/api/config', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
        if (!response.ok) throw new Error('The provider configuration could not be loaded.');
        const raw = await response.text();
        if (raw.length > 65536) throw new Error('The provider configuration is too large.');
        const origin = validateProviderOrigin(JSON.parse(raw).proxyOrigin);
        if (current !== generation) return;
        providerOrigin = origin;
        frame.src = `${origin}/flyflix-provider.html?run=${current}`;
        timeout = setTimeout(() => {
          status.textContent = 'The provider did not start. Check your connection and use Reload to try again.';
        }, 20000);
      } catch (error) {
        if (current === generation) status.textContent = String(error.message || 'The provider could not start.');
      }
    }
    window.addEventListener('message', event => {
      if (event.source !== frame.contentWindow || event.origin !== providerOrigin || event.data?.generation !== generation) return;
      if (event.data.type === 'provider-rendered') {
        clearTimeout(timeout);
        status.textContent = 'Provider connected in a separate browser origin.';
      } else if (event.data.type === 'provider-error') {
        clearTimeout(timeout);
        status.textContent = 'The provider encountered an error. Reload to retry; external players may be unavailable.';
      }
    });
    document.getElementById('retry').addEventListener('click', loadProvider);
    loadProvider();
  </script>
</body>
</html>
