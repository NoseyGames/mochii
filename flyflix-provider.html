<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Flyflix · Monkeh</title>
  <style>body{margin:0;padding:24px;background:#111;color:#eee;font:14px/1.5 system-ui}</style>
</head>
<body>
  <p id="status" role="status">Opening flyflix.net through the proxy…</p>
  <script src="/browser-tools/config.js"></script>
  <script>
    async function startProvider() {
      try {
        const config = await globalThis.MonkehConfig.fetchConfig({ signal: AbortSignal.timeout(10000) });
        if (config.proxyOrigin !== location.origin || !Array.isArray(config.shellOrigins) || config.shellOrigins.includes(location.origin)) {
          throw new Error('Flyflix must open on the separate proxy origin.');
        }
        location.replace('/proxy-host.html#' + encodeURIComponent('https://flyflix.net/'));
      } catch (error) {
        document.getElementById('status').textContent = String(error.message || 'Flyflix could not start. Reload to try again.');
      }
    }
    void startProvider();
  </script>
</body>
</html>
