<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Flyflix provider</title>
  <link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/Consessions/flyflix@89bd78c99e75504faa5f1f8d928e3370574f9eab/main.css">
  <style>html,body{margin:0;background:#090909;color:#eee;font-family:system-ui}#provider-error{padding:24px;line-height:1.5}</style>
</head>
<body>
  <div id="root"></div>
  <p id="provider-error" hidden></p>
  <script>
    // Serve this file only on the proxy origin. The wrapper grants this origin
    // storage and routing, while the browser denies access to the shell origin.
    const generation = Number(new URL(location.href).searchParams.get('run'));
    let shellOrigins = [];
    function report(type) {
      for (const origin of shellOrigins) parent.postMessage({ type, generation }, origin);
    }
    function fail(message) {
      const notice = document.getElementById('provider-error');
      notice.textContent = message;
      notice.hidden = false;
      report('provider-error');
    }
    async function startProvider() {
      try {
        const response = await fetch('/api/config', { cache: 'no-store', signal: AbortSignal.timeout(10000) });
        if (!response.ok) throw new Error('The provider configuration could not be loaded.');
        const raw = await response.text();
        if (raw.length > 65536) throw new Error('The provider configuration is too large.');
        const config = JSON.parse(raw);
        if (config.proxyOrigin !== location.origin || !Array.isArray(config.shellOrigins) || config.shellOrigins.includes(location.origin)) {
          throw new Error('This provider must run on the separate proxy origin.');
        }
        shellOrigins = config.shellOrigins.slice(0, 20).filter(value => {
          try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) && url.origin === value; } catch { return false; }
        });
        // The provider uses BrowserRouter and expects its home view at '/'.
        // Its entry document remains /flyflix-provider.html for wrapper reloads.
        history.replaceState(null, '', '/');
        addEventListener('error', () => report('provider-error'));
        addEventListener('unhandledrejection', () => report('provider-error'));
        const observer = new MutationObserver(() => {
          if (document.getElementById('root').childElementCount) { report('provider-rendered'); observer.disconnect(); }
        });
        observer.observe(document.getElementById('root'), { childList: true });
        const script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = 'https://cdn.jsdelivr.net/gh/Consessions/flyflix@89bd78c99e75504faa5f1f8d928e3370574f9eab/main.js';
        script.addEventListener('error', () => fail('Flyflix could not download its app. Reload to try again.'), { once: true });
        document.head.appendChild(script);
      } catch (error) { fail(String(error.message || 'Flyflix could not start.')); }
    }
    void startProvider();
  </script>
</body>
</html>
