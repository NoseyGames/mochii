<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mochii</title>
  
  <script>
    (function() {
      const authKey = sessionStorage.getItem('authorized_access');

      if (authKey !== 'a1qa2d') {
        window.location.href = 'https://classroom.google.com';
      } else {
        sessionStorage.removeItem('authorized_access');
      }
    })();
  </script>
</head>
<body>

  <script>
    document.addEventListener('click', function openInAboutBlank() {
      // 1. Open the new blank window
      const newWin = window.open('about:blank', '_blank');

      if (newWin) {
        // 2. Define the content to display inside the iframe
        // Replace 'https://example.com' with the destination page/game URL you want inside the cloak
        const targetUrl = 'https://example.com'; 

        // 3. Construct the clean HTML shell
        const htmlContent = `
          <!DOCTYPE html>
          <html>
          <head>
            <title>mochii</title>
            <style>
              * { margin: 0; padding: 0; box-sizing: border-box; }
              body, html { width: 100%; height: 100%; overflow: hidden; background: #080808; }
              iframe { width: 100vw; height: 100vh; border: none; display: block; }
            </style>
          </head>
          <body>
            <iframe src="${targetUrl}"></iframe>
          </body>
          </html>
        `;

        // 4. Write directly to the new window
        newWin.document.open();
        newWin.document.write(htmlContent);
        newWin.document.close();

        // 5. Redirect the original tab to safety
        window.location.href = "https://www.google.com";
      }

      document.removeEventListener('click', openInAboutBlank);
    }, { once: true });
  </script>

</body>
</html>
