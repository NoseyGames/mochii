<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mochii</title>
  
  <script>
    (function() {
      // Check if the session storage authorization key matches
      const authKey = sessionStorage.getItem('authorized_access');

      if (authKey !== 'a1qa2d') {
        // Direct access or invalid attempt -> Redirect immediately
        window.location.href = 'https://classroom.google.com';
      } else {
        // Remove key so refreshing or copying the link directly revokes access
        sessionStorage.removeItem('authorized_access');
      }
    })();
  </script>
</head>
<body>

  <script>
    // Automatically trigger the launcher on the user's first click/interaction
    document.addEventListener('click', function openInAboutBlank() {
      // Open a new blank window
      const newWin = window.open('about:blank', '_blank');

      if (newWin) {
        // Get the full document HTML, but strip out script tags so it doesn't loop infinitely
        const pageClone = document.documentElement.cloneNode(true);
        const scripts = pageClone.querySelectorAll('script');
        scripts.forEach(script => script.remove());
        const pageContent = pageClone.outerHTML;

        // Write the container shell into the about:blank window
        newWin.document.open();
        newWin.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>mochii</title>
            <style>
              body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #080808; }
              iframe { width: 100vw; height: 100vh; border: none; display: block; }
            </style>
          </head>
          <body>
            <iframe id="app-frame"></iframe>
          </body>
          </html>
        `);
        newWin.document.close();

        // Inject the cleaned page content directly into the iframe
        const iframeDoc = newWin.document.getElementById('app-frame').contentDocument;
        iframeDoc.open();
        iframeDoc.write(pageContent);
        iframeDoc.close();

        // Redirect the origin tab
        window.location.href = "https://www.google.com";
      }

      // Remove event listener so it only fires once
      document.removeEventListener('click', openInAboutBlank);
    }, { once: true });
  </script>

</body>
</html>
