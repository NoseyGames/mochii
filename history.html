  <script>
    const zonesURL = "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json";
    const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main/";
    const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";

    const esportsBtn = document.getElementById('esports-btn');
    const popover = document.getElementById('esports-popover');
    const closeBtn = document.getElementById('close-popover');
    const gameListContainer = document.getElementById('game-list');

    let gamesLoaded = false;

    esportsBtn.addEventListener('click', () => {
      popover.classList.add('active');
      if (!gamesLoaded) {
        loadGames();
      }
    });

    closeBtn.addEventListener('click', () => {
      popover.classList.remove('active');
    });

    popover.addEventListener('click', (e) => {
      if (e.target === popover) {
        popover.classList.remove('active');
      }
    });

    // Event Delegation: Single click listener for the entire container
    gameListContainer.addEventListener('click', (e) => {
      const item = e.target.closest('.game-item');
      if (item && item.dataset.targetUrl) {
        openInNewWindow(item.dataset.targetUrl);
      }
    });

    async function loadGames() {
      try {
        const response = await fetch(zonesURL);
        const games = await response.json();
        
        const gameItems = Array.isArray(games) ? games : Object.values(games);
        const fragment = document.createDocumentFragment();

        gameItems.forEach(game => {
          const gameId = game.id || game.url || game.name;
          const gameTitle = game.name || game.title || 'Untitled Game';
          
          const coverImgSrc = game.cover 
            ? (game.cover.startsWith('http') ? game.cover : \`\${coverURL}\${game.cover}\`)
            : \`\${coverURL}\${gameId}.png\`;

          const targetHtmlUrl = game.url 
            ? (game.url.startsWith('http') ? game.url : \`\${htmlURL}/\${game.url}\`)
            : \`\${htmlURL}/\${gameId}.html\`;

          const itemEl = document.createElement('div');
          itemEl.className = 'game-item';
          itemEl.dataset.targetUrl = targetHtmlUrl;
          itemEl.innerHTML = \`
            <img class="game-cover" src="\${coverImgSrc}" alt="\${gameTitle}" loading="lazy" onerror="this.style.display='none'">
            <span>\${gameTitle}</span>
          \`;

          fragment.appendChild(itemEl);
        });

        // Single DOM Write Operation
        gameListContainer.innerHTML = '';
        gameListContainer.appendChild(fragment);

        gamesLoaded = true;
      } catch (err) {
        console.error('Failed to load zones:', err);
        gameListContainer.innerHTML = '<div class="loading-text">Failed to load games list.</div>';
      }
    }

    function openInNewWindow(targetUrl = 'about:blank') {
      const newWin = window.open('about:blank', '_blank');

          </style>
        </head>
        <body>
          <iframe id="app-frame" src="\${targetUrl}"></iframe>
        </body>
        </html>
      \`;
      newWin.document.open();
      newWin.document.write(windowContent);
      newWin.document.close();
    }
  <\/script>

`;
