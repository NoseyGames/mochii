<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mochii</title>
  
  <script>
    (function() {
      const authKey = sessionStorage.getItem('authorized_access');

      if (authKey !== 'a1qa2d') {
        window.location.href = 'https://classroom.google.com';
      } else {
        sessionStorage.removeItem('authorized_access');
      }
    })();
  </script>
</head>
<body>

  <script>
    document.addEventListener('click', function openInAboutBlank() {
      const newWin = window.open('about:blank', '_blank');

      if (newWin) {
        // HTML recreation of the mochii page
        const mochiiPageHTML = `
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>mochii</title>
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
            <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
            <style>
              * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
              }

              body, html {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: #0d0a1a;
                color: #ffffff;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
              }

              /* Background Glow Effect */
              .bg-glow {
                position: absolute;
                width: 100vw;
                height: 100vh;
                background: radial-gradient(circle at center, rgba(62, 38, 105, 0.4) 0%, rgba(13, 10, 26, 0.95) 70%);
                z-index: 0;
                pointer-events: none;
              }

              .container {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 24px;
                width: 100%;
                max-width: 600px;
                padding: 20px;
              }

              /* Navigation / Icon Pill Bar */
              .nav-bar {
                position: absolute;
                top: 24px;
                display: flex;
                align-items: center;
                gap: 16px;
                background: rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.08);
                padding: 8px 18px;
                border-radius: 30px;
              }

              .nav-icon {
                color: #a5a6f6;
                cursor: pointer;
                font-size: 20px;
                transition: opacity 0.2s, transform 0.2s;
                opacity: 0.7;
                display: flex;
                align-items: center;
              }

              .nav-icon:hover {
                opacity: 1;
                transform: translateY(-1px);
              }

              .nav-divider {
                width: 1px;
                height: 16px;
                background: rgba(255, 255, 255, 0.15);
              }

              /* Hero Heading */
              .title {
                font-size: 64px;
                font-weight: 700;
                color: #b1a0ff;
                letter-spacing: -1px;
                margin-top: 40px;
              }

              .subtitle {
                font-size: 14px;
                color: #8c8ea8;
                margin-top: -16px;
                font-weight: 400;
              }

              /* Search Bar */
              .search-container {
                position: relative;
                width: 100%;
                max-width: 440px;
              }

              .search-icon {
                position: absolute;
                left: 16px;
                top: 50%;
                transform: translateY(-50%);
                color: #6b6d8a;
                font-size: 20px;
              }

              .search-input {
                width: 100%;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 14px 16px 14px 48px;
                border-radius: 24px;
                color: #ffffff;
                font-size: 14px;
                outline: none;
                transition: border-color 0.2s, background 0.2s;
              }

              .search-input::placeholder {
                color: #6b6d8a;
              }

              .search-input:focus {
                border-color: rgba(177, 160, 255, 0.4);
                background: rgba(255, 255, 255, 0.05);
              }

              /* Online Status */
              .status-text {
                font-size: 13px;
                color: #6b6d8a;
                font-weight: 500;
              }

              .status-text span {
                color: #8c8ea8;
                font-weight: 600;
              }
            </style>
          </head>
          <body>

            <div class="bg-glow"></div>

            <div class="nav-bar">
              <span class="material-symbols-outlined nav-icon">extension</span>
              <span class="material-symbols-outlined nav-icon">sports_esports</span>
              <span class="material-symbols-outlined nav-icon">apps</span>
              <span class="material-symbols-outlined nav-icon">play_circle</span>
              <span class="material-symbols-outlined nav-icon">desktop_windows</span>
              <span class="material-symbols-outlined nav-icon">smart_toy</span>
              <div class="nav-divider"></div>
              <span class="material-symbols-outlined nav-icon">chat_bubble_outline</span>
              <span class="material-symbols-outlined nav-icon">handshake</span>
              <span class="material-symbols-outlined nav-icon">settings</span>
              <span class="material-symbols-outlined nav-icon">forum</span>
            </div>

            <div class="container">
              <h1 class="title">mochii</h1>
              <p class="subtitle">banana mode</p>

              <div class="search-container">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" class="search-input" placeholder="search anything..." autofocus>
              </div>

              <div class="status-text">
                <span>0</span> users currently online
              </div>
            </div>

          </body>
          </html>
        `;

        // Write shell into blank tab
        newWin.document.open();
        newWin.document.write(`
          <!DOCTYPE html>
          <html>
          <head>
            <title>mochii</title>
            <style>
              body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #080808; }
              iframe { width: 100vw; height: 100vh; border: none; display: block; }
            </style>
          </head>
          <body>
            <iframe id="app-frame"></iframe>
          </body>
          </html>
        `);
        newWin.document.close();

        // Inject page markup into iframe
        const iframeDoc = newWin.document.getElementById('app-frame').contentDocument;
        iframeDoc.open();
        iframeDoc.write(mochiiPageHTML);
        iframeDoc.close();

        // Redirect original tab
        window.location.href = "https://www.google.com";
      }

      document.removeEventListener('click', openInAboutBlank);
    }, { once: true });
  </script>

</body>
</html>
