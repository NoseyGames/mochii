<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <title>Oops · Monkeh</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; background: #101112; color: #f1f2f3; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 440px); }
    p { margin: 0 0 18px; color: #9b9ea3; }
    .brand { font-size: 13px; letter-spacing: 0.08em; }
    h1 { margin: 0 0 18px; font-size: clamp(26px, 6vw, 36px); line-height: 1.25; font-weight: 550; letter-spacing: -0.04em; }
    a { display: inline-block; margin-top: 12px; border: 1px solid #46494e; border-radius: 9px; padding: 10px 16px; color: inherit; text-decoration: none; }
    a:hover { background: #222426; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (prefers-color-scheme: light) { body { background: #f7f7f6; color: #202123; } p { color: #676a70; } a { border-color: #c9cbd0; } a:hover { background: #ececeb; } }
  </style>
</head>
<body>
  <main>
    <p class="brand">MONKEH</p>
    <h1>oops! something went wrong</h1>
    <p>Please return to the site and try again.</p>
    <a href="/math.html">Return to Monkeh</a>
  </main>
</body>
</html>
