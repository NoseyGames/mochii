<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mochii</title>
  <script>
  
    // whatcha doing here bud?
    if (window.self === window.top) {
      document.documentElement.innerHTML = `
        <body style="
          margin:0;
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#0d0d0d;
          color:#ffffff;
          font-family:system-ui,sans-serif;
          font-size:26px;
          font-weight:600;
        ">
          nice try IT 😂
        </body>
      `;
    }
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 500px;
      padding: 20px;
      animation: fadeInUp 0.5s ease forwards;
    }

    .nav-bar {
      position: absolute;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 22px;
      border-radius: 30px;
      z-index: 2;
    }

    .nav-icon {
      color: #a0a0a0;
      cursor: pointer;
      font-size: 20px;
      transition: color 0.2s, transform 0.2s;
      display: flex;
      align-items: center;
    }

    .nav-icon:hover {
      color: #ffffff;
      transform: translateY(-2px);
    }

    .title {
      font-size: 52px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -1px;
      margin-top: 40px;
    }

    .subtitle {
      font-size: 13px;
      color: #666666;
      margin-top: -14px;
    }

    .search-container {
      position: relative;
      width: 100%;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #555555;
      font-size: 18px;
    }

    .search-input {
      width: 100%;
      background: #141414;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px 14px 44px;
      border-radius: 20px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.2);
      background: #181818;
    }

    .search-input::placeholder {
      color: #555555;
    }

    .status-text {
      font-size: 13px;
      color: #555555;
    }

    .status-text span {
      color: #888888;
      font-weight: 600;
    }

    .popover-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .popover-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .popover-card {
      width: 92%;
      max-width: 960px;
      height: 600px;
      background: #111111;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.97);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .popover-overlay.active .popover-card {
      transform: scale(1);
    }

    .popover-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 4px;
    }

    .popover-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .close-btn {
      background: #1c1c1c;
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #888888;
      cursor: pointer;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.2s, background 0.2s;
    }

    .close-btn:hover {
      color: #ffffff;
      background: #252525;
    }

    .controls-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .modal-search-box {
      flex: 1;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 18px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .modal-search-box:focus {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .modal-search-box::placeholder {
      color: #555555;
    }

    .modal-sort-select {
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0 16px;
      border-radius: 12px;
      color: #aaaaaa;
      font-size: 13px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .popover-content {
      flex: 1;
      overflow-y: auto;
      padding-right: 8px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      grid-auto-rows: max-content;
      gap: 14px;
    }

    .popover-content::-webkit-scrollbar {
      width: 6px;
    }
    .popover-content::-webkit-scrollbar-track {
      background: transparent;
    }
    .popover-content::-webkit-scrollbar-thumb {
      background: #262626;
      border-radius: 10px;
    }
    .popover-content::-webkit-scrollbar-thumb:hover {
      background: #383838;
    }

    .game-item {
      display: flex;
      flex-direction: column;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 10px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
    }

    .game-item:hover {
      background: #1c1c1c;
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
    }

    .game-cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      object-fit: cover;
      background: #222222;
      margin-bottom: 10px;
      pointer-events: none;
    }

    .game-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      pointer-events: none;
    }

    .game-title {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-author {
      font-size: 11px;
      color: #666666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .loading-text {
      grid-column: 1 / -1;
      color: #666666;
      font-size: 14px;
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <span class="material-symbols-outlined nav-icon" id="esports-btn" onclick="
      document.getElementById('esports-popover').classList.add('active');
      if(!window.loaded){
        window.blocked=['[!] SUGGEST GAMES .gg/D4c9VFYWyU'];
        window.render=function(){
          var q=document.getElementById('modal-search').value.toLowerCase().trim();
          var s=document.getElementById('modal-sort').value;
          var f=window.raw.filter(function(g){return (g.name||g.title||'').toLowerCase().includes(q)||(g.author||'').toLowerCase().includes(q)});
          if(s==='az')f.sort(function(a,b){return (a.name||a.title||'').localeCompare(b.name||b.title||'')});
          if(s==='za')f.sort(function(a,b){return (b.name||b.title||'').localeCompare(a.name||a.title||'')});
          var c=document.getElementById('game-list');
          if(!f.length){c.innerHTML='<div class=&quot;loading-text&quot;>No games found.</div>';return;}
          var fg=document.createDocumentFragment();
          f.forEach(function(g){
            var t=g.name||g.title||'Untitled';
            var a=g.author||'';
            var u=(g.url||g.file||g.path||'').replace('{HTML_URL}','https://cdn.jsdelivr.net/gh/freebuisness/html@main');
            var v=(g.cover||g.image||'').replace('{COVER_URL}','https://cdn.jsdelivr.net/gh/freebuisness/covers@main');
            var d=document.createElement('div');
            d.className='game-item';
            d.onclick=function(){
              var win=window.open('about:blank','_blank');
              if(win){
                win.document.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d0d0d;color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Loading game content...');
                fetch(u)
                  .then(function(res){return res.text();})
                  .then(function(code){
                    var b='<base href=&quot;'+u+'&quot;>';
                    if(code.indexOf('<head>')!==-1){
                      code=code.replace('<head>','<head>'+b);
                    }else{
                      code=b+code;
                    }
                    win.document.open();
                    win.document.write(code);
                    win.document.close();
                  })
                  .catch(function(){
                    win.document.open();
                    win.document.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0d0d0d;color:#ff5555;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Failed to fetch game source.');
                    win.document.close();
                  });
              }
            };
            d.innerHTML='<img class=&quot;game-cover&quot; src=&quot;'+v+'&quot; alt=&quot;'+t+'&quot; loading=&quot;lazy&quot; onerror=&quot;this.remove()&quot;><div class=&quot;game-info&quot;><span class=&quot;game-title&quot;>'+t+'</span>'+(a?'<span class=&quot;game-author&quot;>'+a+'</span>':'')+'</div>';
            fg.appendChild(d);
          });
          c.innerHTML='';
          c.appendChild(fg);
        };
        fetch('https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json')
          .then(function(r){return r.json()})
          .then(function(g){
            var l=Array.isArray(g)?g:Object.values(g);
            var b=window.blocked.map(function(n){return n.trim().toLowerCase()});
            window.raw=l.filter(function(x){return !b.includes((x.name||x.title||'').trim().toLowerCase())});
            window.render();
            window.loaded=true;
          }).catch(function(){document.getElementById('game-list').innerHTML='<div class=&quot;loading-text&quot;>Failed to load games list.</div>'});
      }
    ">sports_esports</span>

    <span class="material-symbols-outlined nav-icon" onclick="
      var w=window.open('about:blank','_blank');
      if(w){
        w.document.write('<!DOCTYPE html><html><head><title>mochii</title><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0d0d;}iframe{width:100vw;height:100vh;border:none;display:block;}</style></head><body><iframe src=&quot;about:blank&quot;></iframe></body></html>');
        w.document.close();
      }
    ">desktop_windows</span>

    <span class="material-symbols-outlined nav-icon">settings</span>
  </div>

  <div class="container">
    <h1 class="title">mochii</h1>
    <p class="subtitle">banana mode</p>
    <div class="search-container">
      <input type="text" class="search-input" placeholder="search anything..." autofocus>
      <span class="material-symbols-outlined search-icon">search</span>
    </div>
    <div class="status-text">
      <span>0</span> users currently online
    </div>
  </div>

  <div class="popover-overlay" id="esports-popover" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="popover-card">
      <div class="popover-header">
        <span class="popover-title">games</span>
        <button class="close-btn" id="close-popover" onclick="document.getElementById('esports-popover').classList.remove('active')">close</button>
      </div>

      <div class="controls-row">
        <input type="text" class="modal-search-box" id="modal-search" placeholder="search games" oninput="if(window.render)window.render()">
        <select class="modal-sort-select" id="modal-sort" onchange="if(window.render)window.render()">
          <option value="default">Default</option>
          <option value="az">A - Z</option>
          <option value="za">Z - A</option>
        </select>
      </div>

      <div class="popover-content" id="game-list">
        <div class="loading-text">Loading games...</div>
      </div>
    </div>
  </div>

</body>
</html>
