<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mochii</title>
  <script>
    if (window.self === window.top) {
      document.documentElement.innerHTML = `
        <body style="
          margin:0;
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#0d0d0d;
          color:#ffffff;
          font-family:system-ui,sans-serif;
          font-size:26px;
          font-weight:600;
        ">
          nice try IT 😂
        </body>
      `;
    }
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="style.css">

  <style>
    /* Dark Theme Zone Viewer Overlay */
    .viewer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d0d;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      font-family: 'Inter', sans-serif;
      
      /* Animation state (Hidden) */
      opacity: 0;
      visibility: hidden;
      transform: scale(0.96);
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                  visibility 0.25s;
    }

    /* Animated Entrance (Active) */
    .viewer-overlay.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
    }

    .viewer-header {
      height: 54px;
      background: #141414;
      border-bottom: 1px solid #262626;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .viewer-info {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #ffffff;
    }

    .viewer-title {
      font-weight: 700;
      font-size: 16px;
    }

    .viewer-author {
      font-size: 13px;
      color: #888888;
    }

    .viewer-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .viewer-btn {
      background: #222222;
      color: #ffffff;
      border: 1px solid #333333;
      padding: 7px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .viewer-btn:hover {
      background: #2c2c2c;
      border-color: #444444;
    }

    .viewer-btn:active {
      transform: scale(0.96);
    }

    .viewer-close-btn {
      background: #2a1515;
      color: #ff6b6b;
      border-color: #3d1e1e;
    }

    .viewer-close-btn:hover {
      background: #3d1e1e;
      border-color: #572929;
    }

    .viewer-body {
      flex: 1;
      width: 100%;
      background: #000000;
      position: relative;
    }

    .viewer-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="nav-bar">
    <span class="material-symbols-outlined nav-icon" id="esports-btn" onclick="
      document.getElementById('esports-popover').classList.add('active');
      if(!window.loaded){
        window.blocked=['[!] SUGGEST GAMES .gg/D4c9VFYWyU'];
        window.render=function(){
          var q=document.getElementById('modal-search').value.toLowerCase().trim();
          var s=document.getElementById('modal-sort').value;
          var f=window.raw.filter(function(g){return (g.name||g.title||'').toLowerCase().includes(q)||(g.author||'').toLowerCase().includes(q)});
          if(s==='az')f.sort(function(a,b){return (a.name||a.title||'').localeCompare(b.name||b.title||'')});
          if(s==='za')f.sort(function(a,b){return (b.name||b.title||'').localeCompare(a.name||a.title||'')});
          var c=document.getElementById('game-list');
          if(!f.length){c.innerHTML='<div class=&quot;loading-text&quot;>No games found.</div>';return;}
          var fg=document.createDocumentFragment();
          f.forEach(function(g){
            var t=g.name||g.title||'Untitled';
            var a=g.author||'';
            var u=(g.url||g.file||g.path||'').replace('{HTML_URL}','https://cdn.jsdelivr.net/gh/freebuisness/html@main');
            var v=(g.cover||g.image||'').replace('{COVER_URL}','https://cdn.jsdelivr.net/gh/freebuisness/covers@main');
            var d=document.createElement('div');
            d.className='game-item';
            d.onclick=function(){
              window.openViewer(t, a, u);
            };
            d.innerHTML='<img class=&quot;game-cover&quot; src=&quot;'+v+'&quot; alt=&quot;'+t+'&quot; loading=&quot;lazy&quot; onerror=&quot;this.remove()&quot;><div class=&quot;game-info&quot;><span class=&quot;game-title&quot;>'+t+'</span>'+(a?'<span class=&quot;game-author&quot;>'+a+'</span>':'')+'</div>';
            fg.appendChild(d);
          });
          c.innerHTML='';
          c.appendChild(fg);
        };
        fetch('https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json')
          .then(function(r){return r.json()})
          .then(function(g){
            var l=Array.isArray(g)?g:Object.values(g);
            var b=window.blocked.map(function(n){return n.trim().toLowerCase()});
            window.raw=l.filter(function(x){return !b.includes((x.name||x.title||'').trim().toLowerCase())});
            window.render();
            window.loaded=true;
          }).catch(function(){document.getElementById('game-list').innerHTML='<div class=&quot;loading-text&quot;>Failed to load games list.</div>'});
      }
    ">sports_esports</span>

    <span class="material-symbols-outlined nav-icon" onclick="
      var w=window.open('about:blank','_blank');
      if(w){
        w.document.write('<!DOCTYPE html><html><head><title>mochii</title><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0d0d;}iframe{width:100vw;height:100vh;border:none;display:block;}</style></head><body><iframe src=&quot;about:blank&quot;></iframe></body></html>');
        w.document.close();
      }
    ">desktop_windows</span>

    <span class="material-symbols-outlined nav-icon">settings</span>
  </div>

  <div class="container">
    <h1 class="title">mochii</h1>
    <p class="subtitle">banana mode</p>
    <div class="search-container">
      <input type="text" class="search-input" placeholder="search anything..." autofocus>
      <span class="material-symbols-outlined search-icon">search</span>
    </div>
    <div class="status-text">
      <span>0</span> users currently online
    </div>
  </div>

  <div class="popover-overlay" id="esports-popover" onclick="if(event.target===this)this.classList.remove('active')">
    <div class="popover-card">
      <div class="popover-header">
        <span class="popover-title">games</span>
        <button class="close-btn" id="close-popover" onclick="document.getElementById('esports-popover').classList.remove('active')">close</button>
      </div>

      <div class="controls-row">
        <input type="text" class="modal-search-box" id="modal-search" placeholder="search games" oninput="if(window.render)window.render()">
        <select class="modal-sort-select" id="modal-sort" onchange="if(window.render)window.render()">
          <option value="default">Default</option>
          <option value="az">A - Z</option>
          <option value="za">Z - A</option>
        </select>
      </div>

      <div class="popover-content" id="game-list">
        <div class="loading-text">Loading games...</div>
      </div>
    </div>
  </div>

  <!-- Zone Viewer Overlay -->
  <div class="viewer-overlay" id="zone-viewer">
    <div class="viewer-header">
      <div class="viewer-info">
        <span class="viewer-title" id="viewer-title">Untitled</span>
        <span class="viewer-author" id="viewer-author"></span>
      </div>
      <div class="viewer-actions">
        <button class="viewer-btn" onclick="toggleViewerFullscreen()">Fullscreen</button>
        <button class="viewer-btn viewer-close-btn" onclick="closeViewer()">Close</button>
      </div>
    </div>
    <div class="viewer-body">
      <iframe class="viewer-frame" id="viewer-frame"></iframe>
    </div>
  </div>

  <script>
    function openViewer(title, author, url) {
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');
      
      document.getElementById('viewer-title').textContent = title;
      document.getElementById('viewer-author').textContent = author ? 'by ' + author : '';
      
      // Trigger animation
      viewer.classList.add('active');

      // Prepare iframe doc loading state
      const frameDoc = frame.contentWindow.document;
      frameDoc.open();
      frameDoc.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0d0d0d;color:#ffffff;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Loading game content...');
      frameDoc.close();

      // Fetch source and execute inside frame
      fetch(url)
        .then(res => res.text())
        .then(code => {
          frameDoc.open();
          frameDoc.write(code);
          frameDoc.close();
        })
        .catch(() => {
          frameDoc.open();
          frameDoc.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#0d0d0d;color:#ff5555;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Failed to fetch game source.');
          frameDoc.close();
        });
    }

    function closeViewer() {
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');
      
      // Play exit animation
      viewer.classList.remove('active');

      // Reset iframe after the 250ms fade animation completes
      setTimeout(() => {
        frame.src = 'about:blank';
      }, 250);
    }

    function toggleViewerFullscreen() {
      const frame = document.getElementById('viewer-frame');
      if (!document.fullscreenElement) {
        if (frame.requestFullscreen) {
          frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
          frame.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
</html>
