<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mochii</title>

  <!-- Frame-Only Enforcement: Redirects if opened directly -->
  <script>
    if (window.self === window.top) {
      window.location.href = 'https://classroom.google.com';
    }
  </script>

  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Local Proxy & BareMux Scripts -->
  <script src="/bearmux/index.js"></script>
  
  <!-- Ultraviolet Proxy Scripts -->
  <script src="/ultrav/uv.bundle.js"></script>
  <script src="/ultrav/uv.config.js"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Interactive Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-viewport">
    <!-- Top Floating Pill Navigation -->
    <nav class="floating-nav">
      <button class="nav-icon" title="Games" onclick="openGamesPopover()">
        <span class="material-symbols-outlined">sports_esports</span>
      </button>
      <button class="nav-icon" title="Apps & Sites" onclick="openAppsPopover()">
        <span class="material-symbols-outlined">desktop_windows</span>
      </button>
      <button class="nav-icon" title="Settings" onclick="openSettingsModal()">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </nav>

    <!-- Main Hero Section -->
    <main class="main-container">
      <div class="hero-content">
        <h1 class="title">mochii</h1>
        <div class="search-container">
          <input 
            type="text" 
            class="search-input" 
            id="hero-search" 
            placeholder="Search anything... (Press '/' to focus)" 
            autocomplete="off"
          />
          <span class="material-symbols-outlined search-icon">search</span>
        </div>
        <div class="status-badge" id="connection-status">
          <span class="status-indicator" style="background: orange;"></span>
          <span>Connecting to network...</span>

  <!-- Games Modal Overlay -->
  <div class="overlay-backdrop" id="games-popover">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Games Catalog</h2>
        <button class="close-btn" onclick="closeGamesPopover()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="controls-row">
        <input 
          type="text" 
          class="modal-search-box" 
          id="popover-search-input" 
          placeholder="Search catalog..." 
          oninput="window.renderGames && window.renderGames()"
        />
        <select class="modal-sort-select" id="popover-sort-select" onchange="window.renderGames && window.renderGames()">
          <option value="pop">Popularity</option>
          <option value="az">Name (A-Z)</option>
          <option value="za">Name (Z-A)</option>
        </select>
      </div>
      <div class="popover-content" id="game-list">
        <div class="loading-text">Loading catalog...</div>
      </div>
    </div>
  </div>

  <!-- Apps Modal Overlay -->
  <div class="overlay-backdrop" id="apps-popover">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Apps & Sites</h2>
        <button class="close-btn" onclick="closeAppsPopover()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="controls-row">
        <input 
          type="text" 
          class="modal-search-box" 
          id="apps-search-input" 
          placeholder="Search apps..." 
          oninput="window.renderApps && window.renderApps()"
        />
        <select class="modal-sort-select" id="apps-sort-select" onchange="window.renderApps && window.renderApps()">
          <option value="pop">Popularity</option>
          <option value="az">Name (A-Z)</option>
          <option value="za">Name (Z-A)</option>
        </select>
      </div>
      <div class="popover-content" id="apps-list">
        <div class="loading-text">Loading catalog...</div>
      </div>
    </div>
  </div>

  <!-- Settings Modal Overlay -->
  <div class="overlay-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="close-btn" onclick="closeSettingsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-title">Enable Advertisements</span>
            <span class="setting-desc">Toggle dynamic ad scripts on or off</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="ad-toggle" onchange="toggleAds(this.checked)" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Game / App Frame Viewer Overlay -->
  <div class="viewer-overlay" id="zone-viewer">
    <div class="viewer-header">
      <div class="viewer-info">
        <span class="viewer-title" id="viewer-title">Title</span>
        <span class="viewer-author" id="viewer-author">Author</span>
      </div>
      <div class="viewer-actions">
        <button class="viewer-btn" onclick="toggleViewerFullscreen()">Fullscreen</button>
        <button class="viewer-btn viewer-close-btn" onclick="closeViewer()">Close</button>
      </div>
    </div>
    <div class="viewer-body">
      <iframe class="viewer-frame" id="viewer-frame" src="about:blank"></iframe>
    </div>
  </div>

  <!-- Script Implementation -->
  <script>
    /* =========================================================
       1. Core Proxy and Multi-Server Wisp Network Initializer
       ========================================================= */

    const wispEndpoints = [
      {
        name: "anura.pro",
        url: "wss://anura.pro/wisp/"
      },
      {
        name: "Lunar's wisp",
        url: "wss://lunarrr.eminescusm.ro/w/"
      }
    ];

    const BAREMUX_WORKER_PATH = "/bearmux/worker.js";

    let currentEndpointIndex = 0;
    let retryCount = 0;
    let connection = null;

    const MAX_RETRIES_PER_SERVER = 1;
    const RETRY_DELAY_MS = 1000;

    async function initializeNetwork() {
      if (!("serviceWorker" in navigator)) {
        updateStatus("Service Workers Unsupported", "red");
        return false;
      }

      if (window.location.protocol === "about:") {
        updateStatus("Invalid Page Protocol", "red");
        return false;
      }

      try {
        await navigator.serviceWorker.register("/sw.js", { scope: "/" });
        console.log("Service worker registered successfully.");
      } catch (error) {
        console.warn("Service worker registration failed:", error);
        updateStatus("Service Worker Failed", "red");
        return false;
      }

      return connectWisp();
    }

    async function connectWisp() {
      if (!window.BareMux) {
        updateStatus("Failed: BareMux Missing", "red");
        console.error("BareMux is not available on window.");
        return false;
      }

      if (currentEndpointIndex >= wispEndpoints.length) {
        updateStatus("All Networks Offline", "red");
        console.error("No Wisp endpoints remain.");
        return false;
      }

      const endpoint = wispEndpoints[currentEndpointIndex];

      try {
        if (!connection) {
          connection = new BareMux.BareMuxConnection(BAREMUX_WORKER_PATH);
        }

        // Pass direct path string so BareMux worker can load it automatically
        await connection.setTransport(
          "https://cdn.jsdelivr.net/npm/@mercuryworkshop/epoxy-transport@2.0.0/dist/index.mjs",
          [{ wisp: endpoint.url }]
        );

        retryCount = 0;

        updateStatus(
          `Transport Ready: ${endpoint.name}`,
          "#22c55e"
        );

        console.log(
          `Transport initialized for Wisp endpoint: ${endpoint.name}`
        );

        return true;
      } catch (error) {
        console.warn(
          `Failed primary initialization for ${endpoint.name}:`,
          error
        );

        handleWispFailure();
        return false;
      }
    }

    function handleWispFailure() {
      retryCount++;

      if (retryCount > MAX_RETRIES_PER_SERVER) {
        retryCount = 0;
        currentEndpointIndex++;
      }

      if (currentEndpointIndex >= wispEndpoints.length) {
        updateStatus("All Networks Offline", "red");
        console.error("All Wisp endpoints failed.");
        return;
      }

      const nextEndpoint = wispEndpoints[currentEndpointIndex];

      updateStatus(
        `Trying ${nextEndpoint.name}...`,
        "orange"
      );

      window.setTimeout(() => {
        connectWisp();
      }, RETRY_DELAY_MS);
    }

    function updateStatus(text, color) {
      const statusBadge = document.getElementById("connection-status");

      if (!statusBadge) {
        return;
      }

      statusBadge.innerHTML = `
        <span
          class="status-indicator"
          style="background-color: ${color};"
        ></span>
        <span>${escapeHtml(text)}</span>
      `;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    /* =========================================================
       2. Ad Controller 
       ========================================================= */
    let adsEnabled = localStorage.getItem('mochii_ads_enabled') === 'true';

    function initAds() {
      const toggle = document.getElementById('ad-toggle');
      if (toggle) toggle.checked = adsEnabled;
      if (adsEnabled) injectAdScripts();
    }

    function toggleAds(enabled) {
      adsEnabled = enabled;
      localStorage.setItem('mochii_ads_enabled', enabled);
      if (enabled) {
        injectAdScripts();
      } else {
        removeAdScripts();
      }
    }

    function injectAdScripts() {
      if (document.getElementById('aclib-script')) return;
      const script = document.createElement('script');
      script.id = 'aclib-script';
      script.type = 'text/javascript';
      script.src = '//acscdn.com/script/aclib.js';
      script.onload = () => {
        if (window.aclib && typeof window.aclib.runAutoTag === 'function') {
          window.aclib.runAutoTag({ zoneId: 'ulwpnee2f4' });
        }
      };
      document.head.appendChild(script);
    }

    function removeAdScripts() {
      const script = document.getElementById('aclib-script');
      if (script) script.remove();
    }

    /* =========================================================
       3. Background Interactive Canvas
       ========================================================= */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.baseX = this.x;
        this.baseY = this.y;
        this.density = (Math.random() * 20) + 1;
        this.alpha = Math.random() * 0.4 + 0.1;
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < mouse.radius) {
          let force = (mouse.radius - distance) / mouse.radius;
          let directionX = dx / distance;
          let directionY = dy / distance;
          this.x -= directionX * force * this.density * 0.4;
          this.y -= directionY * force * this.density * 0.4;
        } else {
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx * 0.05;
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy * 0.05;
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 12000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.draw();
        p.update();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* =========================================================
       4. Iframe Proxy Routing & UI Navigation
       ========================================================= */
    function handleHeroSearch(query) {
      const trimmed = query.trim();
      if (!trimmed) return;

      let targetUrl = "";
      const urlPattern = /^(https?:\/\/)?([\w\-]+(\.[\w\-]+)+)([\w\-\.,@?^=%&:/~\+#]*[\w\-\@?^=%&/~\+#])?$/i;

      if (urlPattern.test(trimmed)) {
        targetUrl = trimmed.startsWith("http") ? trimmed : "https://" + trimmed;
      } else {
        targetUrl = "https://duckduckgo.com/?q=" + encodeURIComponent(trimmed);
      }

      if (typeof __uv$config !== 'undefined') {
        const encodedUrl = __uv$config.prefix + __uv$config.encodeUrl(targetUrl);
        openViewer("Search", "Web", encodedUrl, true);
      } else {
        alert("Ultraviolet is not configured correctly.");
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const searchInput = document.getElementById('hero-search');
        if (searchInput) searchInput.focus();
      }
    });

    window.popularityData = {};
    window.gamesLoaded = false;
    window.appsLoaded = false;
    window.rawGames = [];
    window.rawApps = [];

    async function fetchPopularity() {
      try {
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=year");
        const data = await response.json();
        if (Array.isArray(data)) {
          data.forEach(file => {
            const idMatch = file.name ? file.name.match(/\/(\d+)\.html$/) : null;
            if (idMatch) {
              const id = parseInt(idMatch[1], 10);
              window.popularityData[id] = file.hits ? file.hits.total : 0;
            }
          });
        }
      } catch (error) {
        window.popularityData[0] = 0;
      }
    }

    function getGameId(game) {
      if (game.id !== undefined) return parseInt(game.id, 10);
      const urlStr = game.url || game.file || game.path || '';
      const match = urlStr.match(/(\d+)\.html/);
      return match ? parseInt(match[1], 10) : null;
    }

    function openGamesPopover() {
      closeAppsPopover();
      const popover = document.getElementById('games-popover');
      if (popover) popover.classList.add('active');

      if (!window.gamesLoaded) {
        window.blocked = ['[!] SUGGEST GAMES .gg/D4c9VFYWyU'];
        
        window.renderGames = function () {
          const searchInput = document.getElementById('popover-search-input');
          const sortSelect = document.getElementById('popover-sort-select');
          const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
          const s = sortSelect ? sortSelect.value : 'pop';

          const f = window.rawGames.filter(g =>
            (g.name || g.title || '').toLowerCase().includes(q) ||
            (g.author || '').toLowerCase().includes(q)
          );

          if (s === 'pop') {
            f.sort((a, b) => {
              const idA = getGameId(a);
              const idB = getGameId(b);
              const popA = idA !== null && window.popularityData[idA] !== undefined ? window.popularityData[idA] : (a.popularity || 0);
              const popB = idB !== null && window.popularityData[idB] !== undefined ? window.popularityData[idB] : (b.popularity || 0);
              return popB - popA;
            });
          } else if (s === 'az') {
            f.sort((a, b) => (a.name || a.title || '').localeCompare(b.name || b.title || ''));
          } else if (s === 'za') {
            f.sort((a, b) => (b.name || b.title || '').localeCompare(a.name || a.title || ''));
          }

          const c = document.getElementById('game-list');
          if (!c) return;

          if (!f.length) {
            c.innerHTML = '<div class="loading-text">No games found.</div>';
            return;
          }

          const fg = document.createDocumentFragment();
          f.forEach(g => {
            const t = g.name || g.title || 'Untitled';
            const a = g.author || '';
            let u = (g.url || g.file || g.path || '').replace('{HTML_URL}', 'https://cdn.jsdelivr.net/gh/securlycdn/html@main');
            const v = (g.cover || g.image || '').replace('{COVER_URL}', 'https://cdn.jsdelivr.net/gh/securlycdn/covers@main');

            if (u && !u.startsWith('http')) {
              u = 'https://cdn.jsdelivr.net/gh/securlycdn/html@main/' + u;
            }

            const d = document.createElement('div');
            d.className = 'game-item';
            d.onclick = () => openViewer(t, a, u, false);
            d.innerHTML = `
              <img class="game-cover" src="${v}" alt="${t}" loading="lazy" onerror="this.style.display='none'">
              <div class="game-info">
                <span class="game-title">${t}</span>
                ${a ? `<span class="game-author">${a}</span>` : ''}
              </div>
            `;
            fg.appendChild(d);
          });
          c.innerHTML = '';
          c.appendChild(fg);
        };

        Promise.all([
          fetchPopularity(),
          fetch('https://cdn.jsdelivr.net/gh/securlycdn/assets/zones.json').then(r => r.json())
        ]).then(([_, g]) => {
          const l = Array.isArray(g) ? g : Object.values(g);
          const b = window.blocked.map(n => n.trim().toLowerCase());
          window.rawGames = l.filter(x => !b.includes((x.name || x.title || '').trim().toLowerCase()));
          window.renderGames();
          window.gamesLoaded = true;
        }).catch(() => {
          document.getElementById('game-list').innerHTML = '<div class="loading-text">Failed to load games list.</div>';
        });
      }
    }

    function closeGamesPopover() {
      const popover = document.getElementById('games-popover');
      if (popover) popover.classList.remove('active');
    }

    function openAppsPopover() {
      closeGamesPopover();
      const popover = document.getElementById('apps-popover');
      if (popover) popover.classList.add('active');

      if (!window.appsLoaded) {
        window.renderApps = function () {
          const searchInput = document.getElementById('apps-search-input');
          const sortSelect = document.getElementById('apps-sort-select');
          const q = searchInput ? searchInput.value.toLowerCase().trim() : '';
          const s = sortSelect ? sortSelect.value : 'pop';

          const f = window.rawApps.filter(g =>
            (g.name || g.title || '').toLowerCase().includes(q) ||
            (g.author || '').toLowerCase().includes(q)
          );

          if (s === 'pop') {
            f.sort((a, b) => {
              const idA = getGameId(a);
              const idB = getGameId(b);
              const popA = idA !== null && window.popularityData[idA] !== undefined ? window.popularityData[idA] : (a.popularity || 0);
              const popB = idB !== null && window.popularityData[idB] !== undefined ? window.popularityData[idB] : (b.popularity || 0);
              return popB - popA;
            });
          } else if (s === 'az') {
            f.sort((a, b) => (a.name || a.title || '').localeCompare(b.name || b.title || ''));
          } else if (s === 'za') {
            f.sort((a, b) => (b.name || b.title || '').localeCompare(a.name || a.title || ''));
          }

          const c = document.getElementById('apps-list');
          if (!c) return;

          if (!f.length) {
            c.innerHTML = '<div class="loading-text">No apps found.</div>';
            return;
          }

          const fg = document.createDocumentFragment();
          f.forEach(g => {
            const t = g.name || g.title || 'Untitled';
            const a = g.author || '';
            let u = (g.url || g.file || g.path || 'flyflix.html').replace('{HTML_URL}', '/flyflix.html');
            const v = (g.cover || g.image || '').replace('{COVER_URL}', 'https://cdn.jsdelivr.net/gh/securlycdn/covers@main');

            if (u && !u.startsWith('http') && !u.startsWith('/')) {
              u = 'https://cdn.jsdelivr.net/gh/securlycdn/html@main/' + u;
            }

            const d = document.createElement('div');
            d.className = 'game-item';
            d.onclick = () => openViewer(t, a, u, false);
            d.innerHTML = `
              <img class="game-cover" src="${v}" alt="${t}" loading="lazy" onerror="this.style.display='none'">
              <div class="game-info">
                <span class="game-title">${t}</span>
                ${a ? `<span class="game-author">${a}</span>` : ''}
              </div>
            `;
            fg.appendChild(d);
          });
          c.innerHTML = '';
          c.appendChild(fg);
        };

        const defaultAppList = [
          { name: 'Flyflix', author: 'Flyflix', url: '/flyflix.html', cover: '' },
          { name: 'Voxiles', author: 'bog', url: '/apps/vox.html', cover: '' }
        ];

        Promise.all([
          fetchPopularity(),
          fetch('https://cdn.jsdelivr.net/gh/securlycdn/assets/apps.json')
            .then(r => r.ok ? r.json() : []).catch(() => [])
        ]).then(([_, fetchedApps]) => {
          const l = Array.isArray(fetchedApps) ? fetchedApps : Object.values(fetchedApps);
          window.rawApps = [...defaultAppList, ...l];
          window.renderApps();
          window.appsLoaded = true;
        }).catch(() => {
          window.rawApps = defaultAppList;
          window.renderApps();
          window.appsLoaded = true;
        });
      }
    }

    function closeAppsPopover() {
      const popover = document.getElementById('apps-popover');
      if (popover) popover.classList.remove('active');
    }

    function openSettingsModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.classList.add('active');
    }

    function closeSettingsModal() {
      const modal = document.getElementById('settings-modal');
      if (modal) modal.classList.remove('active');
    }

    async function openViewer(title, author, url, isProxied = false) {
      closeGamesPopover();
      closeAppsPopover();
      
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');

      document.getElementById('viewer-title').textContent = title;
      document.getElementById('viewer-author').textContent = author ? 'by ' + author : '';

      viewer.classList.add('active');

      if (isProxied) {
        frame.src = url;
      } else {
        frame.src = 'about:blank';
        try {
          const response = await fetch(url);
          const htmlContent = await response.text();
          
          const doc = frame.contentDocument || frame.contentWindow.document;
          doc.open();
          doc.write(htmlContent);
          doc.close();
        } catch (error) {
          const doc = frame.contentDocument || frame.contentWindow.document;
          doc.open();
          doc.write(`<html><body style="background:#111;color:#ff5555;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;"><h3>Failed to load game</h3><p>${error.message}</p></body></html>`);
          doc.close();
        }
      }
    }

    function closeViewer() {
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');
      if (viewer) viewer.classList.remove('active');
      setTimeout(() => {
        if (frame) frame.src = 'about:blank';
      }, 250);
    }

    function toggleViewerFullscreen() {
      const frame = document.getElementById('viewer-frame');
      if (!document.fullscreenElement) {
        if (frame.requestFullscreen) {
          frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
          frame.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initAds();
      initializeNetwork(); 

      const heroSearch = document.getElementById('hero-search');
      if (heroSearch) {
        heroSearch.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            handleHeroSearch(heroSearch.value);
          }
        });
      }
    });
  </script>
</body>
</html>
