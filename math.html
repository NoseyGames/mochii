<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mochii</title>

  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Safe Frame Guard -->
  <script>
    try {
      if (window.self === window.top) {
        document.documentElement.innerHTML = '<body style="background:#000;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">Access Restricted</body>';
      }
    } catch (e) {}
  </script>
</head>
<body>

  <!-- Background Interactive Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-viewport">

    <!-- Top Floating Pill Navigation -->
    <nav class="floating-nav">
      <button class="nav-icon" title="Games" onclick="openGamesPopover()">
        <span class="material-symbols-outlined">sports_esports</span>
      </button>
      <button class="nav-icon" title="Open Cloaked Tab" onclick="openCloakedTab()">
        <span class="material-symbols-outlined">desktop_windows</span>
      </button>
      <button class="nav-icon" title="Settings" onclick="openSettingsModal()">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </nav>

    <!-- Main Hero Section -->
    <main class="main-container">
      <div class="hero-content">
        <h1 class="title">mochii</h1>
        <div class="search-container">
          <input 
            type="text" 
            class="search-input" 
            id="main-search-input" 
            placeholder="Search anything... (Press '/' to focus)" 
            autocomplete="off"
          />
          <span class="material-symbols-outlined search-icon">search</span>
        </div>
        <div class="status-badge">
          <span class="status-indicator"></span>
          <span>0 active users</span>
        </div>
      </div>
    </main>

  </div>

  <!-- Games Modal Overlay -->
  <div class="overlay-backdrop" id="games-popover">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Games Catalog</h2>
        <button class="close-btn" onclick="closeGamesPopover()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="controls-row">
        <input 
          type="text" 
          class="modal-search-box" 
          id="popover-search-input" 
          placeholder="Search catalog..." 
        />
        <select class="modal-sort-select" id="popover-sort-select">
          <option value="name-asc">Name (A-Z)</option>
          <option value="name-desc">Name (Z-A)</option>
        </select>
      </div>
      <div class="popover-content" id="popover-game-grid">
        <div class="loading-text">Loading catalog...</div>
      </div>
    </div>
  </div>

  <!-- Settings Modal Overlay -->
  <div class="overlay-backdrop" id="settings-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Settings</h2>
        <button class="close-btn" onclick="closeSettingsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-title">About:Blank Cloaking</span>
            <span class="setting-desc">Open pages inside a cloaked tab for extra privacy</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-cloaking-toggle" />
            <span class="slider"></span>
          </label>
        </div>
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-title">Particle Background</span>
            <span class="setting-desc">Enable interactive animated stars canvas</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="setting-particles-toggle" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Game / App Frame Viewer Overlay -->
  <div class="viewer-overlay" id="zone-viewer">
    <div class="viewer-header">
      <div class="viewer-info">
        <span class="viewer-title" id="viewer-title">Title</span>
        <span class="viewer-author" id="viewer-author">Author</span>
      </div>
      <div class="viewer-actions">
        <button class="viewer-btn" onclick="fullscreenViewer()">Fullscreen</button>
        <button class="viewer-btn viewer-close-btn" onclick="closeViewer()">Close</button>
      </div>
    </div>
    <div class="viewer-body">
      <iframe class="viewer-frame" id="viewer-iframe" src="about:blank"></iframe>
    </div>
  </div>

</body>
</html>
