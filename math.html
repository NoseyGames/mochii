<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mochii</title>

  <!-- Frame Guard Check -->
  <script>
    if (window.self === window.top) {
      document.documentElement.innerHTML = `
        <body style="
          margin:0;
          height:100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          background:#050505;
          color:#e5e5e5;
          font-family:system-ui,-apple-system,sans-serif;
          font-size:24px;
          font-weight:600;
          letter-spacing:-0.5px;
        ">
          access restricted
        </body>
      `;
    }
  </script>

  <!-- Google Fonts & Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Interactive Background Canvas -->
  <canvas id="bg-canvas"></canvas>

  <div class="app-viewport">
    <!-- Top Navigation -->
    <nav class="nav-bar">
      <div class="brand">
        <div class="brand-dot"></div>
        <span>mochii</span>
      </div>
      <div class="nav-actions">
        <button class="nav-icon" title="Games" onclick="openGamesPopover()">
          <span class="material-symbols-outlined">sports_esports</span>
        </button>
        <button class="nav-icon" title="Open Cloaked Tab" onclick="openCloakedTab()">
          <span class="material-symbols-outlined">desktop_windows</span>
        </button>
        <button class="nav-icon" title="Settings" onclick="openSettingsModal()">
          <span class="material-symbols-outlined">settings</span>
        </button>
      </div>
    </nav>

    <!-- Hero / Main Search Center -->
    <main class="main-container">
      <div class="hero-content">
        <h1 class="title">mochii</h1>
        
        <div class="search-container">
          <input type="text" class="search-input" placeholder="Search anything... (Press '/' to focus)" autofocus id="hero-search">
          <span class="material-symbols-outlined search-icon">search</span>
        </div>

        <div class="status-badge">
          <span class="status-indicator"></span>
          <span><b>0</b> active users</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Games Modal Overlay -->
  <div class="overlay-backdrop" id="esports-popover" onclick="if(event.target===this) closeGamesPopover()">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-title">Games</span>
        <button class="close-btn" onclick="closeGamesPopover()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="controls-row">
        <input type="text" class="modal-search-box" id="modal-search" placeholder="Search games..." oninput="if(window.render)window.render()">
        <select class="modal-sort-select" id="modal-sort" onchange="if(window.render)window.render()">
          <option value="default">Default</option>
          <option value="az">A - Z</option>
          <option value="za">Z - A</option>
        </select>
      </div>

      <div class="popover-content" id="game-list">
        <div class="loading-text">Loading catalog...</div>
      </div>
    </div>
  </div>

  <!-- Settings Modal Overlay -->
  <div class="overlay-backdrop" id="settings-popover" onclick="if(event.target===this) closeSettingsModal()">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <span class="modal-title">Settings</span>
        <button class="close-btn" onclick="closeSettingsModal()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="settings-body">
        <div class="setting-item">
          <div class="setting-info">
            <span class="setting-title">Enable Advertisements</span>
            <span class="setting-desc">Toggle background ad network integration</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="ad-toggle" onchange="toggleAds(this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <!-- Zone Viewer Overlay -->
  <div class="viewer-overlay" id="zone-viewer">
    <div class="viewer-header">
      <div class="viewer-info">
        <span class="viewer-title" id="viewer-title">Untitled</span>
        <span class="viewer-author" id="viewer-author"></span>
      </div>
      <div class="viewer-actions">
        <button class="viewer-btn" onclick="toggleViewerFullscreen()">Fullscreen</button>
        <button class="viewer-btn viewer-close-btn" onclick="closeViewer()">Close</button>
      </div>
    </div>
    <div class="viewer-body">
      <iframe class="viewer-frame" id="viewer-frame"></iframe>
    </div>
  </div>

  <!-- Ad Script Target Container -->
  <div id="ad-container-zone"></div>

  <script>
    /* Ad Controller */
    let adsEnabled = localStorage.getItem('mochii_ads_enabled') === 'true';

    function initAds() {
      const toggle = document.getElementById('ad-toggle');
      if (toggle) toggle.checked = adsEnabled;
      if (adsEnabled) injectAdScripts();
    }

    function toggleAds(enabled) {
      adsEnabled = enabled;
      localStorage.setItem('mochii_ads_enabled', enabled);
      if (enabled) {
        injectAdScripts();
      } else {
        removeAdScripts();
      }
    }

    function injectAdScripts() {
      if (document.getElementById('aclib-script')) return;

      const script = document.createElement('script');
      script.id = 'aclib-script';
      script.type = 'text/javascript';
      script.src = '//acscdn.com/script/aclib.js';
      script.onload = () => {
        if (window.aclib && typeof window.aclib.runAutoTag === 'function') {
          window.aclib.runAutoTag({ zoneId: 'ulwpnee2f4' });
        }
      };
      document.head.appendChild(script);
    }

    function removeAdScripts() {
      const script = document.getElementById('aclib-script');
      if (script) script.remove();
      const zone = document.getElementById('ad-container-zone');
      if (zone) zone.innerHTML = '';
    }

    /* Background Interactive Particle Canvas */
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 140 };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.x;
      mouse.y = e.y;
    });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.5;
        this.baseX = this.x;
        this.baseY = this.y;
        this.density = (Math.random() * 20) + 1;
        this.alpha = Math.random() * 0.3 + 0.1;
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        if (distance < mouse.radius) {
          let force = (mouse.radius - distance) / mouse.radius;
          let directionX = dx / distance;
          let directionY = dy / distance;
          this.x -= directionX * force * this.density * 0.4;
          this.y -= directionY * force * this.density * 0.4;
        } else {
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx * 0.05;
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy * 0.05;
          }
        }
      }
    }

    function initParticles() {
      particles = [];
      const count = Math.floor((canvas.width * canvas.height) / 10000);
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.draw();
        p.update();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

    /* Focus Shortcut */
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        document.getElementById('hero-search').focus();
      }
    });

    /* Modals & Navigation */
    function openGamesPopover() {
      document.getElementById('esports-popover').classList.add('active');
      if (!window.loaded) {
        window.blocked = ['[!] SUGGEST GAMES .gg/D4c9VFYWyU'];
        window.render = function () {
          const q = document.getElementById('modal-search').value.toLowerCase().trim();
          const s = document.getElementById('modal-sort').value;
          const f = window.raw.filter(g =>
            (g.name || g.title || '').toLowerCase().includes(q) ||
            (g.author || '').toLowerCase().includes(q)
          );

          if (s === 'az') f.sort((a, b) => (a.name || a.title || '').localeCompare(b.name || b.title || ''));
          if (s === 'za') f.sort((a, b) => (b.name || b.title || '').localeCompare(a.name || a.title || ''));

          const c = document.getElementById('game-list');
          if (!f.length) {
            c.innerHTML = '<div class="loading-text">No games found.</div>';
            return;
          }

          const fg = document.createDocumentFragment();
          f.forEach(g => {
            const t = g.name || g.title || 'Untitled';
            const a = g.author || '';
            const u = (g.url || g.file || g.path || '').replace('{HTML_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/html@main');
            const v = (g.cover || g.image || '').replace('{COVER_URL}', 'https://cdn.jsdelivr.net/gh/freebuisness/covers@main');

            const d = document.createElement('div');
            d.className = 'game-item';
            d.onclick = () => openViewer(t, a, u);
            d.innerHTML = `
              <img class="game-cover" src="${v}" alt="${t}" loading="lazy" onerror="this.style.display='none'">
              <div class="game-info">
                <span class="game-title">${t}</span>
                ${a ? `<span class="game-author">${a}</span>` : ''}
              </div>
            `;
            fg.appendChild(d);
          });
          c.innerHTML = '';
          c.appendChild(fg);
        };

        fetch('https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json')
          .then(r => r.json())
          .then(g => {
            const l = Array.isArray(g) ? g : Object.values(g);
            const b = window.blocked.map(n => n.trim().toLowerCase());
            window.raw = l.filter(x => !b.includes((x.name || x.title || '').trim().toLowerCase()));
            window.render();
            window.loaded = true;
          })
          .catch(() => {
            document.getElementById('game-list').innerHTML = '<div class="loading-text">Failed to load catalog.</div>';
          });
      }
    }

    function closeGamesPopover() {
      document.getElementById('esports-popover').classList.remove('active');
    }

    function openSettingsModal() {
      document.getElementById('settings-popover').classList.add('active');
    }

    function closeSettingsModal() {
      document.getElementById('settings-popover').classList.remove('active');
    }

    function openCloakedTab() {
      const w = window.open('about:blank', '_blank');
      if (w) {
        w.document.write('<!DOCTYPE html><html><head><title>mochii</title><style>body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#060608;}iframe{width:100vw;height:100vh;border:none;display:block;}</style></head><body><iframe src="about:blank"></iframe></body></html>');
        w.document.close();
      }
    }

    /* Viewer Runtime */
    function openViewer(title, author, url) {
      closeGamesPopover();
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');

      document.getElementById('viewer-title').textContent = title;
      document.getElementById('viewer-author').textContent = author ? 'by ' + author : '';

      viewer.classList.add('active');

      const frameDoc = frame.contentWindow.document;
      frameDoc.open();
      frameDoc.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#060608;color:#f8fafc;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Loading content...');
      frameDoc.close();

      fetch(url)
        .then(res => res.text())
        .then(code => {
          frameDoc.open();
          frameDoc.write(code);
          frameDoc.close();
        })
        .catch(() => {
          frameDoc.open();
          frameDoc.write('<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#060608;color:#94a3b8;display:flex;align-items:center;justify-content:center;font-family:sans-serif;}</style>Failed to load content.');
          frameDoc.close();
        });
    }

    function closeViewer() {
      const viewer = document.getElementById('zone-viewer');
      const frame = document.getElementById('viewer-frame');
      viewer.classList.remove('active');
      setTimeout(() => {
        frame.src = 'about:blank';
      }, 250);
    }

    function toggleViewerFullscreen() {
      const frame = document.getElementById('viewer-frame');
      if (!document.fullscreenElement) {
        if (frame.requestFullscreen) {
          frame.requestFullscreen();
        } else if (frame.webkitRequestFullscreen) {
          frame.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', initAds);
  </script>
</body>
</html>
