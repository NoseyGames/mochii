<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mochii</title>

  <script>
    if (window.self === window.top) {
      document.documentElement.innerHTML = `
        <body style="
          margin:0;

          font-family:system-ui,sans-serif;
          font-size:28px;

        ">

        </body>
      `;
    }
  </script>

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0814;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .bg-glow {
      position: absolute;
      inset: -20%;
      width: 140%;
      height: 140%;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(88, 40, 160, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 80% 20%, rgba(60, 30, 120, 0.4) 0%, transparent 55%),
        radial-gradient(ellipse 90% 70% at 50% 80%, rgba(40, 20, 90, 0.5) 0%, transparent 65%),
        radial-gradient(ellipse 60% 80% at 10% 70%, rgba(70, 35, 140, 0.35) 0%, transparent 50%),
        radial-gradient(ellipse 100% 80% at 70% 60%, rgba(30, 15, 70, 0.4) 0%, transparent 60%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
      animation: flow 18s ease-in-out infinite alternate;
    }

    @keyframes flow {
      0%   { transform: scale(1) translate(0%, 0%) rotate(0deg); }
      25%  { transform: scale(1.08) translate(3%, -2%) rotate(2deg); }
      50%  { transform: scale(0.95) translate(-2%, 3%) rotate(-1.5deg); }
      75%  { transform: scale(1.05) translate(2%, 1%) rotate(1deg); }
      100% { transform: scale(1.02) translate(-1%, -2%) rotate(-0.5deg); }
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 600px;
      padding: 20px;
    }
    .nav-bar {
      position: absolute;
      top: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 10px 22px;
      border-radius: 30px;
    }
    .nav-icon {
      color: #a5a6f6;
      cursor: pointer;
      font-size: 20px;
      transition: opacity 0.2s, transform 0.2s;
      opacity: 0.7;
      display: flex;
      align-items: center;
    }
    .nav-icon:hover {
      opacity: 1;
      transform: translateY(-1px);
    }
    .title {
      font-size: 64px;
      font-weight: 700;
      color: #b1a0ff;
      letter-spacing: -1px;
      margin-top: 40px;
    }
    .subtitle {
      font-size: 14px;
      color: #8c8ea8;
      margin-top: -16px;
    }
    .search-container {
      position: relative;
      width: 100%;
      max-width: 440px;
    }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b6d8a;
      font-size: 20px;
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 16px 14px 48px;
      border-radius: 24px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-input:focus {
      border-color: rgba(177, 160, 255, 0.4);
      background: rgba(255, 255, 255, 0.05);
    }
    .status-text {
      font-size: 13px;
      color: #6b6d8a;
    }
    .status-text span {
      color: #8c8ea8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="nav-bar">
    <span class="material-symbols-outlined nav-icon">sports_esports</span>
    <span class="material-symbols-outlined nav-icon">desktop_windows</span>
    <span class="material-symbols-outlined nav-icon">settings</span>
  </div>
  <div class="container">
    <h1 class="title">mochii</h1>
    <p class="subtitle">banana mode</p>
    <div class="search-container">
      <span class="material-symbols-outlined search-icon">search</span>
      <input type="text" class="search-input" placeholder="search anything..." autofocus>
    </div>
    <div class="status-text">
    </div>
  </div>
</body>
</html>
